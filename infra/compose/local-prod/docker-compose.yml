version: "3.9"

services:
  nginx:
    build:
      context: ../../..
      dockerfile: infra/docker/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../../../env/.env.base
      - ../../../env/.env.local-prod
    volumes:
      - ../../certs:/etc/nginx/certs:ro
    depends_on:
      - web-marketplace
      - web-seller
      - web-admin
      - api

  web-marketplace:
    build:
      context: ../../..
      dockerfile: infra/docker/web-marketplace/Dockerfile
    env_file:
      - ../../../env/.env.base
      - ../../../env/.env.local-prod
    expose:
      - "3000"

  web-seller:
    build:
      context: ../../..
      dockerfile: infra/docker/web-seller/Dockerfile
    env_file:
      - ../../../env/.env.base
      - ../../../env/.env.local-prod
    expose:
      - "3001"

  web-admin:
    build:
      context: ../../..
      dockerfile: infra/docker/web-admin/Dockerfile
    env_file:
      - ../../../env/.env.base
      - ../../../env/.env.local-prod
    expose:
      - "3002"

  api:
    build:
      context: ../../..
      dockerfile: infra/docker/api/Dockerfile
    env_file:
      - ../../../env/.env.base
      - ../../../env/.env.local-prod
    expose:
      - "4000"
    depends_on:
      - redis

  worker:
    build:
      context: ../../..
      dockerfile: infra/docker/worker/Dockerfile
    env_file:
      - ../../../env/.env.base
      - ../../../env/.env.local-prod
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ../../redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    expose:
      - "6379"

volumes:
  redis-data:
