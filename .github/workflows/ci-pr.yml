name: CI — Pull Request

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-setup.yml

  test:
    needs: validate
    uses: ./.github/workflows/reusable-test.yml
    with:
      run-e2e: false
