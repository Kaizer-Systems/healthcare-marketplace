name: Reusable — Deploy to Droplet

on:
  workflow_call:
    inputs:
      droplet-type:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      compose-file:
        type: string
        required: true
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      DROPLET_IP:
        required: true
      GHCR_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ${{ inputs.droplet-type }} droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --env-file /opt/app/.env -f /opt/app/${{ inputs.compose-file }} pull
            docker compose --env-file /opt/app/.env -f /opt/app/${{ inputs.compose-file }} up -d
            docker image prune -f
