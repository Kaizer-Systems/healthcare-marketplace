name: Reusable — Build Docker Images

on:
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [web-marketplace, web-seller, web-admin, api, worker, nginx]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grip-health/${{ matrix.app }}:${{ inputs.image-tag }}
            ghcr.io/${{ github.repository_owner }}/grip-health/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
